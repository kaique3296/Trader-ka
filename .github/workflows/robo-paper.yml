name: Robo BTC - simulacao na nuvem

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'Ação do robô virtual'
        required: true
        type: choice
        default: 'checar'
        options: [checar, iniciar, pausar, encerrar]
  issues:
    types: [opened]
  schedule:
    # UTC. Checagem horaria, sempre no minuto 17 (horario pode atrasar).
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robo-paper-unico
  cancel-in-progress: false

jobs:
  executar-e-publicar:
    # Só o dono do repositório pode acionar os comandos públicos via Issues.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       contains(fromJSON('["TRADERKA_START","TRADERKA_PAUSE","TRADERKA_CLOSE"]'), github.event.issue.title))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Obter codigo e estado anterior
        uses: actions/checkout@v7
        with:
          ref: main  # obtem a versão mais recente do estado ao iniciar a fila
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar biblioteca de calculo
        run: python -m pip install -r requirements.txt

      - name: Validar testes do robô (sem rede e sem ordens reais)
        run: python -m unittest discover -s tests -v

      - name: Rodar simulacao (nao conecta conta da corretora)
        env:
          ROBO_ACAO: ${{ github.event_name == 'issues' && github.event.issue.title || inputs.acao || 'checar' }}
        run: python executar_nuvem.py

      - name: Guardar estado simulado para proxima execucao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- estado_paper.json controle_robo.json estado_comparacao_v4.json estado_comparacao_v5.json
          if [ -d relatorios/historico ]; then git add -A -- relatorios/historico; fi
          if [ -d relatorios/comparativo ]; then git add -A -- relatorios/comparativo; fi
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estado paper trading [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar painel
        uses: actions/upload-pages-artifact@v5
        with:
          path: painel

      - name: Publicar painel
        id: publicar
        uses: actions/deploy-pages@v5
